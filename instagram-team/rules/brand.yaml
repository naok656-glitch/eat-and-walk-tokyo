# ブランド・運用ルール(後から更新できる形式)
# 更新方法: 値を書き換えて changelog.md に1行追記。「未確認」は埋まるまで推測で埋めない。
version: 0.1
updated: 2026-10-20

goal:
  primary: 収益化(アフィリエイト)
  reinvest: 収益が出た分のみ再投入。初期費用は0円
  numeric_targets: 未確認   # 運用データが出てから設定する。根拠のない数値は置かない
  period: 未確認

account:
  status: 新規作成予定
  handle: 未確認
  type: プロ(クリエイター)アカウント   # 収益化機能・インサイトに必要(要確認)
  persona:
    face: なし(本人の顔出し・出演なし)
    options: [手元のみ, イラスト/キャラ, テキスト+図解, AI生成人物]
    selected: 未確認              # 初期案は「テキスト+図解+手元」。AI人物は下記ラベル規定に従う
    ai_person_label: 主役がAI生成の人物の場合は「AI-generated profile」ラベル必須(未表示はリーチ減の報道。公式で要確認)

genre:
  selected: 暮らし・節約・便利グッズ(楽天/Amazon中心、A8は案件を確認して併用)
  status: 暫定(私の判断。変更可)
  reason: research/genre-candidates.md を参照
  link_with_blog: くらしの買い物ノートと連動(リール→記事の相互導線)  # 要承認

monetization:
  accounts: [A8.net, 楽天アフィリエイト, Amazonアソシエイト]   # 既に登録済み(本人申告)
  results_so_far: 収益なし(本人申告)
  link_policy: 各社の規約を確認してから貼る(特にAmazonのSNS利用条件)。未確認の間は貼らない

tone:
  reference_script: なし(本人回答 2026-10-20)  # 後から届いたら tone / structure を抽出して更新
  default_tone: 丁寧で親しみやすい。断定しすぎない。専門用語は避ける
  default_structure: [フック(冒頭3秒), 共感, 結論, 根拠, 具体例, CTA]

ng_expressions:   # 台本・字幕・キャプションで使わない
  - 根拠のない数字(「◯万人が購入」「満足度◯%」など出典なし)
  - 「絶対」「必ず」「誰でも稼げる」「楽して稼げる」
  - 「最安」「No.1」(出典・時点なしの場合)
  - 効果効能の断定(健康・美容・医療に関する表現)
  - 他社・他者の誹謗中傷
  - PR表記の省略・隠蔽

ng_planning:   # 企画のNG条件
  - 他人の動画・画像・音源の無断利用
  - 実在人物の顔・声の無断利用
  - 実際に確認できない商品の使用感・体験談(体験していない「使ってみた」)
  - 薬機法・景表法に触れるおそれのある企画(美容・健康・ダイエットの効果訴求)
  - 出典を示せない統計・事実に依存する企画

metrics:   # 確認する指標(Instagramインサイトで取得可能なもの)
  per_reel: [再生数, リーチ, 平均視聴時間, 視聴維持率, いいね, 保存, シェア, コメント, プロフィール遷移, リンクタップ]
  per_account: [フォロワー増減, プロフィールアクセス, リンクタップ]
  revenue: [クリック数, 成果件数, 報酬額]   # 各ASP管理画面から。投稿とのひも付けは手動
  primary_kpi: 未確認   # 暫定: 保存率とリンクタップ。データ蓄積後に再設定

approvals_required:   # 実行前に必ず本人へ確認
  - 投稿・公開・予約
  - アカウント作成・設定変更
  - アフィリエイトリンクの掲載
  - 有料ツールの契約・課金(初期費用0円方針に反するため原則禁止)
  - 他者への連絡・コメント返信
