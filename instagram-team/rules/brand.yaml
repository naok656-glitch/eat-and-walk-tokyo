# ブランド・運用ルール(後から更新できる形式)
# 更新方法: 値を書き換えて changelog.md に1行追記。「未確認」は埋まるまで推測で埋めない。
version: 0.3
updated: 2026-10-20

goal:
  primary: 収益化(アフィリエイト)
  reinvest: 収益が出た分のみ再投入。初期費用は0円
  numeric_targets: 未確認   # 運用データが出てから設定する。根拠のない数値は置かない
  period: 未確認

account:
  status: 新規作成予定
  handle: 未確認
  type: プロアカウント(クリエイター)   # インサイト閲覧に必要。種類による音源制限の差は未確認
  persona:
    face: なし(本人の顔出し・出演なし)
    selected: 図解・テキスト中心(静止画スライド+字幕+BGM/合成音声)
    hands_footage: 本人が実際に持っている商品に限り可(任意)
    ai_person: 使わない(初期)。使う場合は「AI-generated profile」ラベル必須(報道ベース。公式で要確認)

genre:
  selected: 暮らし・節約・便利グッズ(選び方・比較・節約術の解説型)
  status: 暫定(Claude判断。本人一任済み 2026-10-20)
  reason: research/genre-candidates.md を参照
  link_with_blog: 未確認   # くらしの買い物ノートとの連動は要承認

monetization:
  accounts: [A8.net, 楽天アフィリエイト, Amazonアソシエイト]   # 登録済み(本人申告)
  results_so_far: Amazon 2026年10月(20日時点)に発送済み1件・紹介料64円(管理画面のスクリーンショットで確認)。Instagram経由ではない
  account_status: Amazonアソシエイトは有効(2026-10-20、管理画面にログインできレポート表示を確認。StoreID naoki656-22)。楽天ROOMは未登録
  link_placement:   # Instagramはキャプション内URLがリンクにならない(二次情報。公式で要確認)
    - プロフィールのリンク欄(最大5件とされる)
    - ストーリーズのリンクスタンプ
  link_hub: 楽天ROOM(第一候補。無料。規約は未確認)   # プロフィールリンク→ROOMのコレクションへ誘導
  rules:
    - 規約を確認するまでリンクを貼らない
    - Amazonは、Instagramアカウントをアソシエイトの登録サイトに追加してから使う(手順は未確認)
    - 有料広告・ブースト投稿でAmazonリンクへ誘導しない(2026年4月の規約改定で紹介料対象外と報道)

visuals:   # 素材の権利ルール
  allowed: [自作の図解・テキスト, 本人が撮影した写真・動画, 商用利用可のフリー素材, AI生成イラスト(実物と誤認させない)]
  not_allowed_until_confirmed: [ECサイト・メーカーの商品画像の転載]   # 各社の利用条件を確認するまで使わない
  font: 未確認   # 日本語フォントはNoto Sans JP(OFLライセンス)を第一候補

tone:
  reference_script: なし(本人回答 2026-10-20)  # 後から届いたら tone / structure を抽出して更新
  default_tone: 丁寧で親しみやすい。断定しすぎない。専門用語は避ける
  default_structure: [フック(冒頭3秒), 共感, 結論, 根拠, 具体例, CTA]

ng_expressions:   # 台本・字幕・キャプションで使わない(本人承認 2026-10-20)
  - 根拠のない数字(「◯万人が購入」「満足度◯%」など出典なし)
  - 「絶対」「必ず」「誰でも稼げる」「楽して稼げる」
  - 「最安」「No.1」(出典・時点なしの場合)
  - 効果効能の断定(健康・美容・医療に関する表現)
  - 他社・他者の誹謗中傷
  - PR表記の省略・隠蔽
  - 使っていない商品を使ったように見せる表現

ng_planning:   # 企画のNG条件(本人承認 2026-10-20)
  - 他人の動画・画像・音源の無断利用
  - 実在人物の顔・声の無断利用
  - 実際に確認できない商品の使用感・体験談
  - 薬機法・景表法に触れるおそれのある企画(美容・健康・ダイエットの効果訴求)
  - 出典を示せない統計・事実に依存する企画

metrics:   # 確認する指標(本人承認 2026-10-20)
  per_reel: [再生数, リーチ, 平均視聴時間, 保存, シェア, コメント, いいね, プロフィールアクセス]
  per_reel_if_available: [視聴維持の推移]   # インサイトでの表示有無は未確認
  per_account: [フォロワー増減, プロフィールアクセス, 外部リンクのタップ]
  revenue: [クリック数, 成果件数, 報酬額]   # 各ASP管理画面から。投稿とのひも付けは投稿日で手動
  primary_kpi: [保存, 外部リンクのタップ]   # 暫定。データ蓄積後に再設定
  min_sample_for_judgement: 未確認   # 少数の投稿で結論を出さない

standing_approval: 本人が2026-10-20に「基本的にはすべて承認する」と表明。週次バッチの投稿・自動投稿のテスト投稿は事前承認済みとして進め、結果を報告する。下の項目のうち課金・アカウント設定変更・リンク掲載・他者への連絡は引き続き都度確認
approvals_required:   # 実行前に必ず本人へ確認
  - 投稿・公開・予約
  - アカウント作成・設定変更
  - アフィリエイトリンクの掲載
  - 有料ツールの契約・課金・広告出稿(初期費用0円方針のため原則禁止)
  - 他者への連絡・コメント返信
